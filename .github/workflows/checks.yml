name: Checks
on:
  pull_request:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Worker syntax check
        run: npm run check
      - name: Domain and API unit tests
        run: npm test
      - name: Validate Cloudflare Worker bundle without deployment
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
