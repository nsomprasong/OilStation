name: OilStation Controlled Deployment
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy isolated UAT or customer-facing production Worker
        required: true
        type: choice
        options: [uat, production]
      production_approval:
        description: For production only, type APPROVED_OILSTATION_PRODUCTION_RELEASE
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: oilstation-release-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
      - name: Enforce release marker and production approval from main
        run: |
          test -f supabase/migrations/20261029215000_release_readiness.sql
          test -f docs/release/2026-10-30-controlled-deploy.md
          if [ "${{ inputs.target }}" = production ]; then
            test "${{ github.ref }}" = refs/heads/main
            test "${{ inputs.production_approval }}" = APPROVED_OILSTATION_PRODUCTION_RELEASE
          fi
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'production' || 'oilstation-uat' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: "02e018ecd969426251e2a369a80b713f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_SUPABASE_URL: ${{ secrets.OILSTATION_RELEASE_SUPABASE_URL }}
      RELEASE_SERVICE_ROLE_KEY: ${{ secrets.OILSTATION_RELEASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Fail closed without Cloudflare authentication
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::CLOUDFLARE_API_TOKEN is missing from the GitHub environment"
            exit 1
          }
      - name: Check production database release marker before changing domain Worker
        if: inputs.target == 'production'
        run: |
          set -eu
          test -n "$RELEASE_SUPABASE_URL" && test -n "$RELEASE_SERVICE_ROLE_KEY" || {
            echo "::error::Production DB preflight credentials are missing"
            exit 1
          }
          case "$RELEASE_SUPABASE_URL" in https://*.supabase.co) ;; *)
            echo "::error::Invalid Supabase project URL"; exit 1;; esac
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          # New sb_secret keys are not JWTs; legacy service_role JWTs
          # continue to use the authorization header for compatibility.
          auth_headers=(-H "apikey: $RELEASE_SERVICE_ROLE_KEY")
          if [[ "$RELEASE_SERVICE_ROLE_KEY" != sb_secret_* ]]; then
            auth_headers+=(-H "authorization: Bearer $RELEASE_SERVICE_ROLE_KEY")
          fi
          curl --fail --silent --show-error --max-time 12 \
            "${auth_headers[@]}" \
            -H "content-type: application/json" \
            --data '{}' \
            "$RELEASE_SUPABASE_URL/rest/v1/rpc/oilstation_release_status" > "$tmp"
          jq -e '.ready == true and .schemaVersion == "20261029215000"' "$tmp" >/dev/null || {
            echo "::error::Production Supabase readiness failed"; exit 1; }
      - name: Check encrypted secrets and explicitly enabled production flag
        if: inputs.target == 'production'
        run: |
          set -eu
          secrets_file="$(mktemp)"
          settings_file="$(mktemp)"
          trap 'rm -f "$secrets_file" "$settings_file"' EXIT
          # Wrangler secret list only includes encrypted secrets, not plain-text
          # Worker vars. The API activation flag must be checked separately.
          npx --yes wrangler@4 secret list > "$secrets_file"
          for key in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY COUPON_SIGNING_KEY; do
            jq -e --arg k "$key" 'any(.[]; .name == $k and .type == "secret_text")' "$secrets_file" >/dev/null || {
              echo "::error::Missing required encrypted Worker secret: $key"; exit 1; }
          done
          curl --fail --silent --show-error --max-time 12 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/oilstation/settings" > "$settings_file"
          jq -e '.success == true and any(.result.bindings[]?; .name == "OILSTATION_API_ENABLED" and .type == "plain_text" and .text == "true")' \
            "$settings_file" >/dev/null || {
              echo "::error::Production OILSTATION_API_ENABLED must be an explicit plain-text true before deploying"; exit 1; }
      - name: Deploy safe isolated UAT Worker (no production route or cron)
        if: inputs.target == 'uat'
        run: npx --yes wrangler@4 deploy --env uat
      - name: Deploy production only after preflight
        if: inputs.target == 'production'
        run: npx --yes wrangler@4 deploy
      - name: Verify isolated UAT liveness
        if: inputs.target == 'uat'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://oilstation-uat.nsomprasong.workers.dev/api/health |
            jq -e '.service == "oilstation" and .status == "ok"'
      - name: Verify customer-facing readiness
        if: inputs.target == 'production'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://oilstation.goldensoft.cloud/api/health |
            jq -e '.service == "oilstation" and .status == "ok"'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://oilstation.goldensoft.cloud/api/ready |
            jq -e '.ready == true'
