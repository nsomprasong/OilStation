name: Invitation OAuth Email Proof SQL (isolated)
on:
  pull_request:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
jobs:
  invite-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated_testing_only
          POSTGRES_DB: oilstation_invite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oilstation_invite_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Test mismatched Facebook email proof, limits and one-time invitation acceptance
        run: |
          docker run --rm --network host -v "$PWD":/work:ro \
            -e PGPASSWORD=isolated_testing_only postgres:16-alpine \
            sh -eu -c '
              export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=oilstation_invite_test
              psql -v ON_ERROR_STOP=1 -f /work/test/integration/invite-fixture.sql
              psql -v ON_ERROR_STOP=1 -f /work/supabase/migrations/20261029122000_accept_invitation.sql
              psql -v ON_ERROR_STOP=1 -f /work/supabase/migrations/20261029213000_invited_email_otp.sql
              psql -v ON_ERROR_STOP=1 -f /work/test/integration/invite-assertions.sql
            '
