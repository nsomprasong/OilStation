name: OilStation Playwright Browser E2E
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: Run public smoke, Sales, or Platform Support
        required: true
        default: public
        options: [public, authorized-platform, authorized-qa-finance, authorized-qa-fuel-prices, authorized-support]
      allow_missing_station_creation:
        type: boolean
        description: Allow Sales02 to create ONLY missing QA-S02-B after DB preflight
        default: false
permissions:
  contents: read
concurrency:
  group: oilstation-playwright-live-db
  cancel-in-progress: false
jobs:
  public-browser:
    if: github.event_name == 'pull_request' || inputs.suite == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run real unauthenticated Chromium (never seed QA)
        run: npm run test:e2e -- --grep '@public'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: oilstation-public-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  authorized-platform:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.suite == 'authorized-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oilstation-qa
    env:
      OILSTATION_QA_AUTH_RUN: 'true'
      OILSTATION_QA_ALLOW_CREATE: ${{ inputs.allow_missing_station_creation }}
      OILSTATION_QA_SALES01_PASSWORD: ${{ secrets.OILSTATION_QA_SALES01_PASSWORD }}
      OILSTATION_QA_SALES02_PASSWORD: ${{ secrets.OILSTATION_QA_SALES02_PASSWORD }}
      OILSTATION_QA_DB_KEY: ${{ secrets.OILSTATION_QA_DB_KEY }}
      OILSTATION_QA_EVIDENCE_PASSPHRASE: ${{ secrets.OILSTATION_QA_EVIDENCE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fail closed if protected QA secrets are unavailable
        run: |
          for name in OILSTATION_QA_SALES01_PASSWORD OILSTATION_QA_SALES02_PASSWORD OILSTATION_QA_DB_KEY OILSTATION_QA_EVIDENCE_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing protected secret name: $name"; exit 1; }
          done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser + API + actual Supabase + audit (one missing station maximum)
        run: npm run test:e2e -- --grep '@auth'
      - name: Encrypt traces and screenshots BEFORE uploading to public-repo Actions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-report test-results
          tar -czf qa-evidence.tar.gz playwright-report test-results
          printf '%s' "$OILSTATION_QA_EVIDENCE_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output qa-evidence.tar.gz.gpg qa-evidence.tar.gz
          rm -rf qa-evidence.tar.gz playwright-report test-results
      - name: Upload ENCRYPTED browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilstation-protected-playwright-encrypted
          path: qa-evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14

  authorized-qa-finance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.suite == 'authorized-qa-finance'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oilstation-qa
    env:
      OILSTATION_QA_FINANCE_AUTH_RUN: 'true'
      OILSTATION_QA_C01_ADMIN_PASSWORD: ${{ secrets.OILSTATION_QA_C01_ADMIN_PASSWORD }}
      OILSTATION_QA_C01_DRIVER_PASSWORD: ${{ secrets.OILSTATION_QA_C01_DRIVER_PASSWORD }}
      OILSTATION_QA_S01A_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S01A_OWNER_PASSWORD }}
      OILSTATION_QA_EVIDENCE_PASSPHRASE: ${{ secrets.OILSTATION_QA_EVIDENCE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fail closed unless both role credentials and artifact key are configured
        shell: bash
        run: |
          set -euo pipefail
          for name in OILSTATION_QA_C01_ADMIN_PASSWORD OILSTATION_QA_C01_DRIVER_PASSWORD OILSTATION_QA_S01A_OWNER_PASSWORD OILSTATION_QA_EVIDENCE_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing protected QA secret name: $name"; exit 1; }
          done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser login + real QA request + separate approval + reserve QR
        run: npm run test:e2e -- --grep '@qa-finance'
      - name: Encrypt sensitive QA traces BEFORE uploading
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-report test-results
          tar -czf finance-evidence.tar.gz playwright-report test-results
          printf '%s' "$OILSTATION_QA_EVIDENCE_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output finance-evidence.tar.gz.gpg finance-evidence.tar.gz
          rm -rf finance-evidence.tar.gz playwright-report test-results
      - name: Upload encrypted finance UAT evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilstation-qa-finance-protected-playwright
          path: finance-evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14

  authorized-qa-fuel-prices:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.suite == 'authorized-qa-fuel-prices'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: oilstation-qa
    env:
      OILSTATION_QA_PRICE_AUTH_RUN: 'true'
      OILSTATION_QA_S01A_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S01A_OWNER_PASSWORD }}
      OILSTATION_QA_S01B_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S01B_OWNER_PASSWORD }}
      OILSTATION_QA_S02A_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S02A_OWNER_PASSWORD }}
      OILSTATION_QA_S02B_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S02B_OWNER_PASSWORD }}
      OILSTATION_QA_EVIDENCE_PASSPHRASE: ${{ secrets.OILSTATION_QA_EVIDENCE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require four station owner QA credentials and encryption key before any change
        shell: bash
        run: |
          set -euo pipefail
          for name in OILSTATION_QA_S01A_OWNER_PASSWORD OILSTATION_QA_S01B_OWNER_PASSWORD OILSTATION_QA_S02A_OWNER_PASSWORD OILSTATION_QA_S02B_OWNER_PASSWORD OILSTATION_QA_EVIDENCE_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing QA credential name: $name"; exit 1; }
          done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Set 8 fictional fuel prices ONLY through 4 real QA Owner web forms
        run: npm run test:e2e -- --grep '@qa-fuel-prices'
      - name: Encrypt real browser evidence before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-report test-results
          tar -czf price-evidence.tar.gz playwright-report test-results
          printf '%s' "$OILSTATION_QA_EVIDENCE_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output price-evidence.tar.gz.gpg price-evidence.tar.gz
          rm -rf price-evidence.tar.gz playwright-report test-results
      - name: Upload encrypted price entry screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilstation-qa-fuel-prices-protected-playwright
          path: price-evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14

  authorized-support:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.suite == 'authorized-support'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oilstation-qa
    env:
      OILSTATION_QA_SUPPORT_RUN: 'true'
      OILSTATION_QA_SUPPORT01_PASSWORD: ${{ secrets.OILSTATION_QA_SUPPORT01_PASSWORD }}
      OILSTATION_QA_DB_KEY: ${{ secrets.OILSTATION_QA_DB_KEY }}
      OILSTATION_QA_EVIDENCE_PASSPHRASE: ${{ secrets.OILSTATION_QA_EVIDENCE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fail closed unless Support01 and evidence secrets exist
        shell: bash
        run: |
          set -euo pipefail
          for name in OILSTATION_QA_SUPPORT01_PASSWORD OILSTATION_QA_DB_KEY OILSTATION_QA_EVIDENCE_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing protected secret name: $name"; exit 1; }
          done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Read-only Support browser/API/Supabase/audit/role-denial
        run: npm run test:e2e -- --grep '@support'
      - name: Encrypt ALL Support traces and screenshots before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-report test-results
          tar -czf support-evidence.tar.gz playwright-report test-results
          printf '%s' "$OILSTATION_QA_EVIDENCE_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output support-evidence.tar.gz.gpg support-evidence.tar.gz
          rm -rf support-evidence.tar.gz playwright-report test-results
      - name: Upload encrypted Support evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilstation-support-playwright-encrypted
          path: support-evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14
