name: OilStation Production Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oilstation-production-preview
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: "02e018ecd969426251e2a369a80b713f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check, test and build
        run: |
          npm run check
          npm test
          npm run build
      - name: Require Cloudflare deployment token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the GitHub production environment"
            exit 1
          fi
      - name: Deploy OilStation frontend and guarded Worker to real domain
        run: npx --yes wrangler@4 deploy
      - name: Verify public preview and disabled financial operations
        run: |
          set -e
          base="https://oilstation.goldensoft.cloud"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 15 "$base/" > /tmp/oilstation-preview.html
          test -s /tmp/oilstation-preview.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 15 "$base/api/health" |
            jq -e '.service == "oilstation" and .status == "ok"'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 15 "$base/api/public-config" |
            jq -e '.supabaseUrl == "https://cxihsotcpdnalswfoysx.supabase.co" and (.supabaseAnonKey | length > 0) and .stripePublishableKey == null'
          # /api/me is intentionally accessible to authenticated preview users;
          # an anonymous caller must get 401 rather than a 503 release error.
          code="$(curl --silent --output /tmp/oilstation-member.json --write-out '%{http_code}' --max-time 15 "$base/api/me")"
          test "$code" = 401
          jq -e '.error == "unauthenticated"' /tmp/oilstation-member.json
          code="$(curl --silent --output /tmp/oilstation-business.json --write-out '%{http_code}' --max-time 15 "$base/api/coupons")"
          test "$code" = 503
          jq -e '.error == "release_not_enabled"' /tmp/oilstation-business.json
          # Invitation/fuel APIs are enabled for authenticated, scoped users,
          # but an anonymous caller must not reach the database or trigger mail.
          for route in "/api/station-fuels?stationId=22222222-2222-4222-8222-222222222222"; do
            code="$(curl --silent --output /tmp/oilstation-fuel-auth.json --write-out '%{http_code}' --max-time 15 "$base$route")"
            test "$code" = 401
            jq -e '.error == "unauthenticated"' /tmp/oilstation-fuel-auth.json
          done
          code="$(curl --silent --output /tmp/oilstation-fuel-write.json --write-out '%{http_code}' --max-time 15 \
            -X POST -H "origin: $base" -H "content-type: application/json" \
            --data '{"stationId":"22222222-2222-4222-8222-222222222222","stationFuelId":"33333333-3333-4333-8333-333333333333","enabled":true,"publicPrice":"32.50"}' \
            "$base/api/station-fuel-config")"
          test "$code" = 401
          jq -e '.error == "unauthenticated"' /tmp/oilstation-fuel-write.json
          code="$(curl --silent --output /tmp/oilstation-invite-auth.json --write-out '%{http_code}' --max-time 15 \
            -X POST -H "origin: $base" -H "content-type: application/json" \
            --data '{"email":"safe@example.com","roleCode":"station_owner","scopeType":"station","scopeId":"22222222-2222-4222-8222-222222222222"}' \
            "$base/api/invitations/create")"
          test "$code" = 401
          jq -e '.error == "unauthenticated"' /tmp/oilstation-invite-auth.json
          code="$(curl --silent --output /tmp/oilstation-payment-disabled.json --write-out '%{http_code}' --max-time 15 "$base/api/billing/payment-intent")"
          test "$code" = 503
          jq -e '.error == "release_not_enabled"' /tmp/oilstation-payment-disabled.json
