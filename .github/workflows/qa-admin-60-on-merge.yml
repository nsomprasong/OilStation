name: QA 60 Corporate personnel — Admin-owned browser run
on:
  push:
    branches: [main]
    paths: [.github/workflows/qa-admin-60-on-merge.yml]
permissions:
  contents: read
concurrency:
  group: oilstation-qa-admin-corporate-60-one-shot
  cancel-in-progress: false
jobs:
  qa-admin-creates-own-staff:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: oilstation-qa
    env:
      OILSTATION_QA_ADMIN_STAFF_RUN: 'true'
      OILSTATION_QA_SALES01_PASSWORD: ${{ secrets.OILSTATION_QA_SALES01_PASSWORD }}
      OILSTATION_QA_SALES02_PASSWORD: ${{ secrets.OILSTATION_QA_SALES02_PASSWORD }}
      OILSTATION_QA_DB_KEY: ${{ secrets.OILSTATION_QA_DB_KEY }}
      OILSTATION_QA_EVIDENCE_PASSPHRASE: ${{ secrets.OILSTATION_QA_EVIDENCE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require only protected QA credentials, never use Sales as creator
        shell: bash
        run: |
          set -euo pipefail
          for name in OILSTATION_QA_SALES01_PASSWORD OILSTATION_QA_SALES02_PASSWORD OILSTATION_QA_DB_KEY OILSTATION_QA_EVIDENCE_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing protected QA secret: $name"; exit 1; }
          done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Authenticate Station Admins and Corporate Admins, create only own staff on real web
        run: npm run test:e2e -- --grep '@qa-own-admin-staff'
      - name: Encrypt screenshots and traces before any upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-report test-results
          tar -czf qa-admin-staff-evidence.tar.gz playwright-report test-results
          printf '%s' "$OILSTATION_QA_EVIDENCE_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output qa-admin-staff-evidence.tar.gz.gpg qa-admin-staff-evidence.tar.gz
          rm -rf qa-admin-staff-evidence.tar.gz playwright-report test-results
      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilstation-qa-admin-60-encrypted
          path: qa-admin-staff-evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14
