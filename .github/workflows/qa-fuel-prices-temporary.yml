name: QA station fuel prices via real web (one-shot)
on:
  push:
    branches: [feature/qa-wallet-photo-only-20261031]
    paths: [.github/workflows/qa-fuel-prices-temporary.yml]
permissions:
  contents: read
concurrency:
  group: oilstation-qa-prices-browser-one-shot
  cancel-in-progress: false
jobs:
  qa-station-prices-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oilstation-qa
    env:
      OILSTATION_QA_PRICE_AUTH_RUN: 'true'
      OILSTATION_QA_S01A_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S01A_OWNER_PASSWORD }}
      OILSTATION_QA_S01B_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S01B_OWNER_PASSWORD }}
      OILSTATION_QA_S02A_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S02A_OWNER_PASSWORD }}
      OILSTATION_QA_S02B_OWNER_PASSWORD: ${{ secrets.OILSTATION_QA_S02B_OWNER_PASSWORD }}
      OILSTATION_QA_EVIDENCE_PASSPHRASE: ${{ secrets.OILSTATION_QA_EVIDENCE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require exact four QA station owner credentials and artifact key before starting
        shell: bash
        run: |
          set -euo pipefail
          for name in OILSTATION_QA_S01A_OWNER_PASSWORD OILSTATION_QA_S01B_OWNER_PASSWORD OILSTATION_QA_S02A_OWNER_PASSWORD OILSTATION_QA_S02B_OWNER_PASSWORD OILSTATION_QA_EVIDENCE_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing QA secret name: $name"; exit 1; }
          done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Login real QA owners and enter 32.50 Diesel and 35.90 Gasohol 95 on the deployed website
        run: npm run test:e2e -- --grep '@qa-fuel-prices'
      - name: Encrypt all traces/screenshots, remove cleartext
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-report test-results
          tar -czf qa-prices-evidence.tar.gz playwright-report test-results
          printf '%s' "$OILSTATION_QA_EVIDENCE_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output qa-prices-evidence.tar.gz.gpg qa-prices-evidence.tar.gz
          rm -rf qa-prices-evidence.tar.gz playwright-report test-results
      - name: Upload only encrypted QA owner browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilstation-qa-fuel-prices-one-shot-encrypted
          path: qa-prices-evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14
