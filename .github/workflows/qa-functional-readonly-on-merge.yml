name: QA real functional browser journeys - read-only on fixed QA actors
on:
  workflow_dispatch: # Protected, read-only live QA suite; run only from main
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-functional-readonly-on-merge.yml
      - e2e/qa.functional-readonly.pw.mjs
      - e2e/qa.full-screen-readonly.pw.mjs
permissions:
  contents: read
  actions: read
concurrency:
  group: oilstation-qa-functional-readonly
  cancel-in-progress: false
jobs:
  real-functional-browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: oilstation-qa
    env:
      OILSTATION_QA_FUNCTIONAL_READONLY_RUN: 'true'
      OILSTATION_QA_THREE_GROUP_SWEEP: 'true'
      OILSTATION_QA_EVIDENCE_PASSPHRASE: ${{ secrets.OILSTATION_QA_EVIDENCE_PASSPHRASE }}
      OILSTATION_QA_SALES01_PASSWORD: ${{ secrets.OILSTATION_QA_SALES01_PASSWORD }}
      OILSTATION_QA_SALES02_PASSWORD: ${{ secrets.OILSTATION_QA_SALES02_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require exact commit to finish guarded production preview deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '.workflow_runs[] | select(.name=="OilStation Production Preview" and .event=="push") | .conclusion' | head -1)"
            if [ "$status" = success ]; then echo 'Matching guarded preview deployed'; exit 0; fi
            if [ "$status" = failure ] || [ "$status" = cancelled ]; then
              echo '::error::Deploy failed'; exit 1
            fi
            sleep 10
          done
          echo '::error::Matching deploy not verified'; exit 1
      - name: Require protected existing QA secrets only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OILSTATION_QA_SALES01_PASSWORD" || { echo '::error::QA Sales01 secret missing'; exit 1; }
          test -n "$OILSTATION_QA_SALES02_PASSWORD" || { echo '::error::QA Sales02 secret missing'; exit 1; }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Three groups, every permitted main screen and contextual task, live read-only browser
        run: npm run test:e2e -- e2e/qa.full-screen-readonly.pw.mjs --reporter=list
      - name: Existing approved functional read-only journeys against same deployed main
        if: always()
        run: npm run test:e2e -- --grep '@qa-functional' --reporter=list
      - name: Encrypt protected browser evidence (never upload plaintext JWT screenshots/traces)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OILSTATION_QA_EVIDENCE_PASSPHRASE" || {
            echo "::error::Protected evidence encryption secret missing"; exit 1; }
          mkdir -p playwright-report test-results
          tar -czf qa-20261105-three-group-evidence.tar.gz playwright-report test-results
          printf '%s' "$OILSTATION_QA_EVIDENCE_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 \
              --output qa-20261105-three-group-evidence.tar.gz.gpg qa-20261105-three-group-evidence.tar.gz
          rm -rf qa-20261105-three-group-evidence.tar.gz playwright-report test-results
      - name: Upload encrypted live QA evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilstation-qa-three-group-evidence-encrypted
          path: qa-20261105-three-group-evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14

