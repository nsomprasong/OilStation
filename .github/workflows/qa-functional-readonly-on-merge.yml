name: QA real functional browser journeys - read-only on fixed QA actors
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-functional-readonly-on-merge.yml
      - e2e/qa.functional-readonly.pw.mjs
permissions:
  contents: read
  actions: read
concurrency:
  group: oilstation-qa-functional-readonly
  cancel-in-progress: false
jobs:
  real-functional-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oilstation-qa
    env:
      OILSTATION_QA_FUNCTIONAL_READONLY_RUN: 'true'
      OILSTATION_QA_SALES01_PASSWORD: ${{ secrets.OILSTATION_QA_SALES01_PASSWORD }}
      OILSTATION_QA_SALES02_PASSWORD: ${{ secrets.OILSTATION_QA_SALES02_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require exact commit to finish guarded production preview deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '.workflow_runs[] | select(.name=="OilStation Production Preview" and .event=="push") | .conclusion' | head -1)"
            if [ "$status" = success ]; then echo 'Matching guarded preview deployed'; exit 0; fi
            if [ "$status" = failure ] || [ "$status" = cancelled ]; then
              echo '::error::Deploy failed'; exit 1
            fi
            sleep 10
          done
          echo '::error::Matching deploy not verified'; exit 1
      - name: Require protected existing QA secrets only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OILSTATION_QA_SALES01_PASSWORD" || { echo '::error::QA Sales01 secret missing'; exit 1; }
          test -n "$OILSTATION_QA_SALES02_PASSWORD" || { echo '::error::QA Sales02 secret missing'; exit 1; }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Real UI navigation and authorized read-only workflows across 4 stations/12 companies
        run: npm run test:e2e -- --grep '@qa-functional' --reporter=list
