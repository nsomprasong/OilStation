name: QA linked GPS attendance - bounded fictional Chromium UAT
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-gps-linked-on-merge.yml
      - e2e/qa.gps-linked.pw.mjs
permissions:
  contents: read
  actions: read
concurrency:
  group: oilstation-customer-facing-worker
  cancel-in-progress: false
jobs:
  arm-qa-hr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: "02e018ecd969426251e2a369a80b713f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - name: Enforce production finance OFF and fixed QA scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          if(c.vars.OILSTATION_API_ENABLED!=='false'||
            c.vars.OILSTATION_QA_FINANCE_SIM_ENABLED!=='false'||
            c.vars.OILSTATION_QA_HR_UAT_ENABLED==='true'||
            c.vars.OILSTATION_DEPLOY_TARGET!=='production'||
            c.vars.OILSTATION_QA_STATION_IDS?.split(',').length!==4||
            c.vars.OILSTATION_QA_COMPANY_IDS?.split(',').length!==12)
            throw Error('FAIL CLOSED: QA controls not in frozen baseline');
          NODE
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Ensure reviewed code and build before temporary QA enablement
        run: |
          npm run check
          npm test
          npm run build
      - name: Arm only scoped HR QA lane, automatically expiring at 45 min
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='wrangler.jsonc',c=JSON.parse(readFileSync(file,'utf8'));
          c.vars.OILSTATION_QA_HR_UAT_ENABLED='true';
          c.vars.OILSTATION_QA_BUSINESS_UAT_TEMP='true';
          c.vars.OILSTATION_QA_UAT_EXPIRES_EPOCH=String(Math.floor(Date.now()/1000)+2700);
          writeFileSync(file,JSON.stringify(c,null,2));
          NODE
          npx --yes wrangler@4 deploy
          test "$(curl -s -o /tmp/gps-gated -w '%{http_code}' https://oilstation.goldensoft.cloud/api/ready)" = 503

  run-qa-browser:
    needs: arm-qa-hr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oilstation-qa
    env:
      OILSTATION_QA_GPS_LINKED_RUN: 'true'
      OILSTATION_QA_SALES01_PASSWORD: ${{ secrets.OILSTATION_QA_SALES01_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - name: Require real existing protected QA account
        run: test -n "$OILSTATION_QA_SALES01_PASSWORD"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Attendant signs in, synthetic GPS requests, owner independently approves
        run: npm run test:e2e -- --grep '@qa-gps-linked' --reporter=list

  disarm-qa-hr:
    if: ${{ always() }}
    needs: [arm-qa-hr, run-qa-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: "02e018ecd969426251e2a369a80b713f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - name: Always restore guarded Worker baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          if(c.vars.OILSTATION_API_ENABLED!=='false'||
             c.vars.OILSTATION_QA_FINANCE_SIM_ENABLED!=='false'||
             c.vars.OILSTATION_QA_HR_UAT_ENABLED==='true')
            throw Error('Refuse unsafe disarm config');
          NODE
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npx --yes wrangler@4 deploy
          test "$(curl -s -o /tmp/gps-closed -w '%{http_code}' https://oilstation.goldensoft.cloud/api/hr/roster)" = 503
