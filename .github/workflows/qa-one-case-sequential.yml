name: "QA serialized exactly six new UAT cases"
on:
  push:
    branches: [main]
    paths:
      - 'e2e/qa.case-*.pw.mjs'
      - '.github/workflows/qa-one-case-sequential.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: oilstation-qa-one-next-case-serial
  cancel-in-progress: false
jobs:
  one-case:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oilstation-qa
    env:
      OILSTATION_QA_BATCH_RUN: 'true'
      OILSTATION_QA_REVIEW_PASSWORD: ${{ secrets.OILSTATION_QA_REVIEW_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - name: Select six new Master cases or bounded never-started recovery 039-044
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status HEAD^ HEAD -- e2e/ > /tmp/qa-batch-e2e-changes.tsv
          mapfile -t all < <(awk 'NF {print $2}' /tmp/qa-batch-e2e-changes.tsv | sort -u)
          mapfile -t changed < <(awk '($1=="A" || ($1=="M" && $2 ~ /^e2e\/qa\.case-master-[a-z0-9-]+-0(39|41|56)\.pw\.mjs$/)) && $2 ~ /^e2e\/qa\.case-[a-z0-9-]+\.pw\.mjs$/ {print $2}' /tmp/qa-batch-e2e-changes.tsv | sort -u)
          if (( ${#changed[@]} != 6 && ${#changed[@]} != 2 && ${#changed[@]} != 1 )); then
            echo "::error::Expected six new cases, exact retry 039+041, or failed 056 only; got ${#changed[@]}"; exit 1
          fi
          if (( ${#changed[@]} == 2 )); then
            [[ "${changed[0]}" =~ -039\.pw\.mjs$ && "${changed[1]}" =~ -041\.pw\.mjs$ ]] || {
              echo "::error::Two-case recovery reserved solely for failed 039 and 041"; exit 1; }
          fi
          if (( ${#changed[@]} == 1 )); then
            [[ "${changed[0]}" =~ -056\.pw\.mjs$ ]] || { echo "::error::Single-case retry reserved solely for failed 056"; exit 1; }
          fi
          if (( ${#all[@]} != ${#changed[@]} )); then
            echo "::error::Only the exact failed 056 or never-started 039/041 specs may be modified; other cases must be new"; exit 1
          fi
          declare -a ids=()
          for spec in "${changed[@]}"; do
            if [[ ! "$spec" =~ -([0-9]{3})\.pw\.mjs$ ]]; then
              echo "::error::Missing numeric case ID in $spec"; exit 1
            fi
            ids+=("${BASH_REMATCH[1]}")
            if ! grep -q OILSTATION_QA_BATCH_RUN "$spec"; then
              echo "::error::Batch guard missing from $spec"; exit 1
            fi
          done
          mapfile -t sorted < <(printf '%s\n' "${ids[@]}" | sort -n)
          if (( 10#${sorted[0]} < 39 )); then
            echo "::error::Cannot rerun passed cases 001-038"; exit 1
          fi
          for ((i=1; i<${#sorted[@]}; i++)); do
            if (( ${#changed[@]} == 6 && 10#${sorted[i]} != 10#${sorted[i-1]} + 1 )); then
              echo "::error::Batch cases must have unique consecutive IDs"; exit 1
            fi
          done
          printf '%s\n' "${changed[@]}" > .qa-new-batch-specs.txt
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const matrix=JSON.parse(readFileSync('docs/qa/scenarios/oilstation-master-236-evidence-crosswalk.json','utf8'));
          const files=readFileSync('.qa-new-batch-specs.txt','utf8').trim().split('\n');
          const ids=files.map(f=>{
            const src=readFileSync(f,'utf8');
            return src.match(/MASTER_UAT_ID='([PSCX]-\d{2}-[HVRF])'/)?.[1];
          });
          const retry=ids.length===2&&ids.includes('P-01-R')&&ids.includes('S-01-V');
          const retry056=ids.length===1&&ids[0]==='S-03-V';
          if((ids.length!==6&&!retry&&!retry056)||ids.some(x=>!x)||new Set(ids).size!==ids.length)
            throw Error('Six new Master cases or exact failed 039/041/056 retry required');
          const batch=matrix.batches.find(b=>b.lane==='TEST_QUEUE'&&
            ((ids.length===6&&b.caseIds.length===6&&b.caseIds.every(x=>ids.includes(x)))||
              (retry&&b.batchId==='TEST-6-001')||(retry056&&b.batchId==='TEST-6-003')));
          if(!batch)throw Error('IDs do not match approved Master batch or exact retry');
          console.log('Approved Master UAT batch: '+batch.batchId+' '+ids.join(', '));
          if(ids.some(id=>!matrix.cases.some(x=>x.id===id&&
             ['PARTIAL','NOT_TESTED'].includes(x.matchedStatus))))
            throw Error('No prior PASS, blocked, obsolete or owner-skipped Master case allowed');
          console.log('Approved Master UAT batch: '+batch.batchId+' '+ids.join(', '));
          NODE
          echo "QA_BATCH_COUNT=${#changed[@]}" >> "$GITHUB_ENV"
          printf 'Selected new cases only: %s\n' "${changed[@]}"
      - name: Confirm matching guarded preview deploy was successful
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '[.workflow_runs[] | select(.name=="OilStation Production Preview" and .event=="push")] | .[0].conclusion // ""')"
            if [ "$result" = success ]; then exit 0; fi
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "::error::Guarded preview deployment failed"; exit 1
            fi
            sleep 10
          done
          echo "::error::Matching preview deploy not confirmed"; exit 1
      - name: Validate protected QA Secret exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OILSTATION_QA_REVIEW_PASSWORD" || {
            echo "::error::Missing protected QA review Secret"; exit 1; }
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run only the selected batch, serially; require all cases to PASS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t specs < .qa-new-batch-specs.txt
          test "${#specs[@]}" -eq "$QA_BATCH_COUNT"
          test "$QA_BATCH_COUNT" -eq 1 || test "$QA_BATCH_COUNT" -eq 2 || test "$QA_BATCH_COUNT" -eq 6
          npm run test:e2e -- "${specs[@]}" --workers=1 --reporter=list | tee /tmp/oilstation-qa-batch.log
          grep -Eq "[[:space:]]${QA_BATCH_COUNT} passed \(" /tmp/oilstation-qa-batch.log || {
            echo "::error::Not every new case passed"; exit 1
          }
