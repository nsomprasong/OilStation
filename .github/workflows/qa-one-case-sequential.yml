name: "QA serialized new-case batch"
on:
  push:
    branches: [main]
    paths:
      - 'e2e/qa.case-*.pw.mjs'
      - '.github/workflows/qa-one-case-sequential.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: oilstation-qa-one-next-case-serial
  cancel-in-progress: false
jobs:
  one-case:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oilstation-qa
    env:
      OILSTATION_QA_BATCH_RUN: 'true'
      OILSTATION_QA_REVIEW_PASSWORD: ${{ secrets.OILSTATION_QA_REVIEW_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - name: Select 2-6 newly added QA cases only; never rerun passed specs
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status HEAD^ HEAD -- e2e/ > /tmp/qa-batch-e2e-changes.tsv
          mapfile -t all < <(awk 'NF {print $2}' /tmp/qa-batch-e2e-changes.tsv | sort -u)
          mapfile -t changed < <(awk '$1=="A" && $2 ~ /^e2e\/qa\.case-[a-z0-9-]+\.pw\.mjs$/ {print $2}' /tmp/qa-batch-e2e-changes.tsv | sort -u)
          if (( ${#changed[@]} < 2 || ${#changed[@]} > 6 )); then
            echo "::error::Batch must add 2-6 new isolated QA specs, got ${#changed[@]}"; exit 1
          fi
          if (( ${#all[@]} != ${#changed[@]} )); then
            echo "::error::A prior spec changed or an unapproved e2e file is included"; exit 1
          fi
          declare -a ids=()
          for spec in "${changed[@]}"; do
            if [[ ! "$spec" =~ -([0-9]{3})\.pw\.mjs$ ]]; then
              echo "::error::Missing numeric case ID in $spec"; exit 1
            fi
            ids+=("${BASH_REMATCH[1]}")
            if ! grep -q OILSTATION_QA_BATCH_RUN "$spec"; then
              echo "::error::Batch guard missing from $spec"; exit 1
            fi
          done
          mapfile -t sorted < <(printf '%s\n' "${ids[@]}" | sort -n)
          if (( 10#${sorted[0]} < 23 )); then
            echo "::error::Cannot rerun cases 001-022"; exit 1
          fi
          for ((i=1; i<${#sorted[@]}; i++)); do
            if (( 10#${sorted[i]} != 10#${sorted[i-1]} + 1 )); then
              echo "::error::Batch cases must have unique consecutive IDs"; exit 1
            fi
          done
          printf '%s\n' "${changed[@]}" > .qa-new-batch-specs.txt
          echo "QA_BATCH_COUNT=${#changed[@]}" >> "$GITHUB_ENV"
          printf 'Selected new cases only: %s\n' "${changed[@]}"
      - name: Confirm matching guarded preview deploy was successful
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '[.workflow_runs[] | select(.name=="OilStation Production Preview" and .event=="push")] | .[0].conclusion // ""')"
            if [ "$result" = success ]; then exit 0; fi
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "::error::Guarded preview deployment failed"; exit 1
            fi
            sleep 10
          done
          echo "::error::Matching preview deploy not confirmed"; exit 1
      - name: Validate protected QA Secret exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OILSTATION_QA_REVIEW_PASSWORD" || {
            echo "::error::Missing protected QA review Secret"; exit 1; }
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run only the selected batch, serially; require all cases to PASS
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t specs < .qa-new-batch-specs.txt
          test "${#specs[@]}" -eq "$QA_BATCH_COUNT"
          npm run test:e2e -- "${specs[@]}" --workers=1 --reporter=list | tee /tmp/oilstation-qa-batch.log
          grep -Eq "[[:space:]]${QA_BATCH_COUNT} passed \(" /tmp/oilstation-qa-batch.log || {
            echo "::error::Not every new case passed"; exit 1
          }
