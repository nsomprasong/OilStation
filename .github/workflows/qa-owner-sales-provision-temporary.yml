name: OilStation owner one-shot Sales provisions QA staff (temporary)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: oilstation-playwright-live-db
  cancel-in-progress: false
jobs:
  sales-owned-roles:
    if: >-
      github.repository == 'nsomprasong/OilStation' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 53 &&
      github.event.issue.pull_request != null &&
      github.actor == 'nsomprasong' &&
      github.event.comment.user.login == 'nsomprasong' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/qa-playwright-sales-owned-roles-20261031-once'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oilstation-qa
    env:
      OILSTATION_QA_SALES_PROVISION_RUN: 'true'
      OILSTATION_QA_SALES01_PASSWORD: ${{ secrets.OILSTATION_QA_SALES01_PASSWORD }}
      OILSTATION_QA_SALES02_PASSWORD: ${{ secrets.OILSTATION_QA_SALES02_PASSWORD }}
      OILSTATION_QA_DB_KEY: ${{ secrets.OILSTATION_QA_DB_KEY }}
      OILSTATION_QA_EVIDENCE_PASSPHRASE: ${{ secrets.OILSTATION_QA_EVIDENCE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fail closed unless approved protected QA secrets present
        shell: bash
        run: |
          set -euo pipefail
          for name in OILSTATION_QA_SALES01_PASSWORD OILSTATION_QA_SALES02_PASSWORD OILSTATION_QA_DB_KEY OILSTATION_QA_EVIDENCE_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing secret $name"; exit 1; }
          done
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Real Sales login, own-scoped 36 role accounts and cross-tenant denials
        run: npm run test:e2e -- --grep '@sales-provision'
      - name: Encrypt all authenticated QA browser evidence before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playwright-report test-results
          tar -czf sales-roles-evidence.tar.gz playwright-report test-results
          printf '%s' "$OILSTATION_QA_EVIDENCE_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output sales-roles-evidence.tar.gz.gpg sales-roles-evidence.tar.gz
          rm -rf sales-roles-evidence.tar.gz playwright-report test-results
      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilstation-sales-created-roles-encrypted
          path: sales-roles-evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14
