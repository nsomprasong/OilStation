name: "QA targeted fresh S-06-R read-only tenant isolation"
on:
  push:
    branches: [main]
    paths:
      - 'e2e/qa.plate-preview-tenant.pw.mjs'
      - '.github/workflows/qa-plate-preview-tenant.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: oilstation-qa-one-next-case-serial
  cancel-in-progress: false
jobs:
  one-new-case:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oilstation-qa
    env:
      OILSTATION_QA_REVIEW_PASSWORD: ${{ secrets.OILSTATION_QA_REVIEW_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - name: Verify exact failed-only S-06-R retry and protected Secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OILSTATION_QA_REVIEW_PASSWORD"
          changed="$(git diff --name-status HEAD^ HEAD -- e2e/)"
          expected="$(printf 'M\te2e/qa.plate-preview-tenant.pw.mjs')"
          test "$changed" = "$expected" || { echo "::error::Only previously failed S-06-R may be retried"; exit 1; }
          grep -Fq 'FAILED_ONLY_RETRY_S06R' e2e/qa.plate-preview-tenant.pw.mjs
          grep -Fq 'WORKFLOW_YAML_REPAIR_S06R' e2e/qa.plate-preview-tenant.pw.mjs
      - name: Confirm same-commit guarded Production Preview success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '[.workflow_runs[] | select(.name=="OilStation Production Preview" and .event=="push")] | .[0].conclusion // ""')"
            if [ "$result" = success ]; then exit 0; fi
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "::error::Same SHA Preview deploy failed"; exit 1
            fi
            sleep 10
          done
          echo "::error::Same SHA Preview unavailable"; exit 1
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ONLY failed S-06-R scoped photo check
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e -- e2e/qa.plate-preview-tenant.pw.mjs --workers=1 --reporter=list | tee /tmp/oilstation-photo-s06r.log
          grep -Eq '[[:space:]]1 passed \(' /tmp/oilstation-photo-s06r.log
          grep -Fq 'MASTER_CASE S-06-R AUTHORIZED_PRIVATE_PLATE_READ_AND_FOREIGN_STATION_403_PASS' /tmp/oilstation-photo-s06r.log
