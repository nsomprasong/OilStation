name: QA review login password (all 98 QA accounts)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET-98-QA-USERS; uses shared QA environment Secret, never a password input'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oilstation-qa-review-password
  cancel-in-progress: false
jobs:
  qa-review-credentials:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'RESET-98-QA-USERS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oilstation-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies without any credential in the environment
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Preflight all 98 frozen QA identities and roles before any writes
        env:
          OILSTATION_QA_DB_KEY: ${{ secrets.OILSTATION_QA_DB_KEY }}
          OILSTATION_QA_REVIEW_PASSWORD: ${{ secrets.OILSTATION_QA_REVIEW_PASSWORD }}
        run: node scripts/qa-rotate-review-passwords.mjs --dry-run
      - name: Rotate 98 QA accounts and verify Supabase Auth plus OilStation role via /api/me
        env:
          OILSTATION_QA_DB_KEY: ${{ secrets.OILSTATION_QA_DB_KEY }}
          OILSTATION_QA_REVIEW_PASSWORD: ${{ secrets.OILSTATION_QA_REVIEW_PASSWORD }}
          OILSTATION_QA_ROTATE_CONFIRM: QA-20261104-REVIEW-98
        run: node scripts/qa-rotate-review-passwords.mjs --apply
