name: QA review login password (22 sample accounts only)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET-22-QA-SAMPLES; uses one shared GitHub environment SECRET, not a workflow input'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: oilstation-qa-review-password
  cancel-in-progress: false
jobs:
  qa-review-credentials:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'RESET-22-QA-SAMPLES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oilstation-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies without any credential in the environment
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Preflight all 22 existing QA-only identities before any writes
        env:
          OILSTATION_QA_DB_KEY: ${{ secrets.OILSTATION_QA_DB_KEY }}
          OILSTATION_QA_REVIEW_PASSWORD: ${{ secrets.OILSTATION_QA_REVIEW_PASSWORD }}
        run: node scripts/qa-rotate-review-passwords.mjs --dry-run
      - name: Rotate only those 22 QA accounts with the shared temporary password and verify Auth
        env:
          OILSTATION_QA_DB_KEY: ${{ secrets.OILSTATION_QA_DB_KEY }}
          OILSTATION_QA_REVIEW_PASSWORD: ${{ secrets.OILSTATION_QA_REVIEW_PASSWORD }}
          OILSTATION_QA_ROTATE_CONFIRM: QA-20261104-REVIEW-22
        run: node scripts/qa-rotate-review-passwords.mjs --apply
